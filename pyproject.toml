[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egovision"
version = "0.1.0"
description = "Egocentric localisation analysis"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dinov2 = ["transformers>=4.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
